<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>area256</title>
  <meta name="description" content="area256 on GitHub">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 0 16px;
    }
    main { max-width: 36rem; }
    h1 { font: 600 2.5rem/1.1 ui-monospace, "SF Mono", Menlo, monospace; margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>area256</h1>
    <p>Experiments in training language models from scratch.</p>
    <a href="https://github.com/area256">github.com/area256 &rarr;</a>
  </main>
</body>
</html>
