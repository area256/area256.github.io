<svg class="chart" viewBox="0 0 760 330" role="img" aria-labelledby="kv-cache-against-context-t kv-cache-against-context-d">
<title id="kv-cache-against-context-t">KV cache against context length</title>
<desc id="kv-cache-against-context-d">KV cache for one sequence of our model in bf16. Per token it is 120 KB with 20 KV heads, 24 KB with the 4 our model uses, and 6 KB with one. At 32K tokens that is 4.03, 0.81 and 0.20 GB, against 0.98 GB for the weights.</desc>
<text class="axis-label" x="56" y="16">KV cache for one sequence, bf16</text>
<line class="grid" x1="56" x2="570" y1="286.0" y2="286.0"/>
<text class="tick" x="48" y="290.0" text-anchor="end">0 GB</text>
<line class="grid" x1="56" x2="570" y1="230.0" y2="230.0"/>
<text class="tick" x="48" y="234.0" text-anchor="end">1 GB</text>
<line class="grid" x1="56" x2="570" y1="174.0" y2="174.0"/>
<text class="tick" x="48" y="178.0" text-anchor="end">2 GB</text>
<line class="grid" x1="56" x2="570" y1="118.0" y2="118.0"/>
<text class="tick" x="48" y="122.0" text-anchor="end">3 GB</text>
<line class="grid" x1="56" x2="570" y1="62.0" y2="62.0"/>
<text class="tick" x="48" y="66.0" text-anchor="end">4 GB</text>
<text class="tick" x="56.0" y="306" text-anchor="middle">0K</text>
<text class="tick" x="184.5" y="306" text-anchor="middle">8K</text>
<text class="tick" x="313.0" y="306" text-anchor="middle">16K</text>
<text class="tick" x="441.5" y="306" text-anchor="middle">24K</text>
<text class="tick" x="570.0" y="306" text-anchor="middle">32K</text>
<text class="axis-label" x="570" y="324" text-anchor="end">context length, tokens</text>
<line class="ref" x1="56" x2="570" y1="231.2" y2="231.2"/>
<text class="note" x="564.0" y="225.2" text-anchor="end">the model's own weights: 0.98 GB</text>
<path class="line line-other" d="M56.0,286.0 L88.1,271.9 L120.2,257.8 L184.5,229.6 L313.0,173.3 L441.5,116.9 L570.0,60.5"/>
